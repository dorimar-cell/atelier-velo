<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier Vélo — Aurum Manto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="ui">
      <header>
        <p class="brand">Atelier Vélo</p>
        <p class="step" data-step>00 / 08</p>
      </header>
      <section class="story">
        <p class="kicker" data-kicker>Ателье</p>
        <h1 data-title>Соберите велосипед из живых деталей</h1>
        <p class="lede" data-lede>
          Начните с рамы. Каждая выбранная деталь прилетает на своё место фиксации.
        </p>
      </section>
      <aside class="dock">
        <div class="types" data-types></div>
        <div class="options" data-options></div>
      </aside>
      <footer>
        <div class="rail" data-rail></div>
        <p class="view-hint">Тяните, чтобы повернуть · колесо или щипок — масштаб</p>
        <button class="reset" type="button" data-reset>Сбросить</button>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
